services:
  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    ports:
      - "3307:3306"          # 3307 en tu PC para no chocar con MariaDB (3306)
    environment:
      MYSQL_DATABASE: hotel_management
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql   # los datos sobreviven al parar el contenedor

volumes:
  mysql-data: