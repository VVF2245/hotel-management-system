spring.application.name=hotel-management

# Database connection. Credentials come from environment variables; never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# "update" is temporary while the entities are being defined; switch to Flyway + "validate" before the services.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
