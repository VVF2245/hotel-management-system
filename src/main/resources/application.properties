spring.application.name=hotel-management

# Load local secrets from .env (ignored by git). Optional so CI and other environments can use real environment variables.
spring.config.import=optional:file:.env[.properties]

# Database connection. Credentials come from .env or environment variables; never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hotel_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# "update" is temporary while the entities are being defined; switch to Flyway + "validate" before the services.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC